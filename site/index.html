<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevFest</title>
  <meta name="description" content="Talks and workshops with your local developer community.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dots"><i></i><i></i><i></i><i></i></span>
      <strong id="brand-name">DevFest</strong>
    </div>
    <nav>
      <a href="#speakers">Speakers</a>
      <a href="#schedule">Schedule</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
    </nav>
  </header>

  <section class="hero">
    <p class="eyebrow" id="hero-eyebrow"></p>
    <h1 id="hero-title"></h1>
    <p class="tagline" id="hero-tagline"></p>
    <div class="countdown" id="countdown"></div>
  </section>

  <main>
    <section id="speakers">
      <h2>Speakers</h2>
      <div class="grid" id="speaker-grid"></div>
    </section>

    <section id="schedule">
      <h2>Schedule</h2>
      <div class="tabs" id="day-tabs"></div>
      <ol class="timeline" id="timeline"></ol>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="app.js"></script>
  <script>
    /* Dev-only live reload: the page refreshes itself when any site file changes. */
    (function () {
      var seen = null;
      setInterval(function () {
        fetch("/__version", { cache: "no-store" })
          .then(function (r) { return r.text(); })
          .then(function (v) { if (seen && v !== seen) location.reload(); seen = v; })
          .catch(function () {});
      }, 700);
    })();
  </script>
</body>
</html>
